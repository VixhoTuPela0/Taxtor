<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt</title>
</head>

<body>

    <h1>Upload Receipt</h1>

    <form id="uploadForm">

        <input
            type="number"
            id="Amount"
            placeholder="Amount"
            step="0.01"
            min="0"
            required
        >

        <input
            type="text"
            id="Merchant"
            name="merchant"
            placeholder="Merchant"
            required
        >

        <input
            type="text"
            id="paymentMethod"
            name="payment_method"
            placeholder="Payment Method"
            required
        >

        <!-- CATEGORY -->
        <select id="category" name="category" required>
            <option value="">Loading categories...</option>
        </select>

        <input
            type="file"
            id="receiptPhoto"
            name="invoice_image"
            accept=".png,.jpg,.jpeg,.webp"
            required
        >

        <button type="submit">
            Upload Receipt
        </button>

    </form>

    <p id="message"></p>


    <script>

        // CHECK SESSION ID STATUS
        document.addEventListener("DOMContentLoaded", async () => {

            try {

                const response = await fetch("/api/");

                // Checks first if there is a redirection
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                // If it receives code 200, the session/cookie is okay
                if (response.status == 200) {

                    // Load the user's categories
                    loadCategories();

                    return;
                }

            } catch (error) {

                console.error(
                    "Error checking the session:",
                    error
                );

            }

        });


        // LOAD USER CATEGORIES
        async function loadCategories() {

            const categorySelect =
                document.getElementById("category");

            try {

                const response = await fetch("/api/categories");

                if (!response.ok) {
                    throw new Error("Could not load categories.");
                }

                const categories = await response.json();

                // Remove loading message
                categorySelect.innerHTML = "";

                // Default option
                const defaultOption =
                    document.createElement("option");

                defaultOption.value = "";
                defaultOption.textContent =
                    "Select a category";

                defaultOption.disabled = true;
                defaultOption.selected = true;

                categorySelect.appendChild(defaultOption);


                // Add user's categories
                categories.forEach(category => {

                    const option =
                        document.createElement("option");

                    option.value = category.name;
                    option.textContent = category.name;

                    categorySelect.appendChild(option);

                });


                // If user has no categories
                if (categories.length === 0) {

                    categorySelect.innerHTML = "";

                    const option =
                        document.createElement("option");

                    option.value = "";
                    option.textContent =
                        "No categories available";

                    option.disabled = true;
                    option.selected = true;

                    categorySelect.appendChild(option);
                }


            } catch (error) {

                console.error(
                    "Error loading categories:",
                    error
                );

                categorySelect.innerHTML = "";

                const option =
                    document.createElement("option");

                option.textContent =
                    "Error loading categories";

                option.disabled = true;

                categorySelect.appendChild(option);
            }
        }


        const form =
            document.getElementById("uploadForm");

        const message =
            document.getElementById("message");


        // UPLOAD RECEIPT
        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const amount =
                document.getElementById("Amount").value;

            const merchant =
                document.getElementById("Merchant").value;

            const paymentMethod =
                document.getElementById("paymentMethod").value;

            const category =
                document.getElementById("category").value;

            const receiptPhoto =
                document.getElementById("receiptPhoto").files[0];


            // Creates the form
            const form_data =
                new FormData();

            form_data.append(
                "amount",
                amount
            );

            form_data.append(
                "merchant",
                merchant
            );

            form_data.append(
                "payment_method",
                paymentMethod
            );

            form_data.append(
                "category",
                category
            );

            form_data.append(
                "invoice_image",
                receiptPhoto
            );


            try {

                // Calls receipts
                const response =
                    await fetch("/api/receipts", {
                        method: "POST",
                        body: form_data
                    });


                const data =
                    await response.json();


                if (response.ok) {

                    message.textContent =
                        data.message;

                    // Optional: reset form
                    form.reset();

                } else {

                    // Show backend error
                    message.textContent =
                        data.detail ||
                        "Error uploading receipt.";

                }


            } catch (error) {

                console.error(
                    "Error de conexión:",
                    error
                );

                message.textContent =
                    "No se pudo conectar con el servidor.";

            }

        });

    </script>

</body>

</html>
