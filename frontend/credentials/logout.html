<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logout</title>
</head>

<body>

<script>
async function logout() {
    try {
        // Directly calls logout endpoint
        const response = await fetch("/api/logout", {
            method: "POST"
        });

        console.log("Logout status:", response.status);

        // Either is to login: no session activated, or login: logout successful
        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

    } catch (error) {
        // Error log
        console.error("Logout error:", error);
    }
}

logout();
</script>

</body>
</html>
