<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <h1>Iniciar sesión</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Usuario"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <p id="message"></p>


    <script>
        // Check if cookies are there
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch("/api/cookies_state");

                // Checks first if there is a redirection
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                // If it recieves code 200, the session/cookie is okay
                if (response.status == 200) {return;}
            } catch (error) {
                console.error("Error verificando la sesión:", error);
            }
        }); 
    

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");


        // Look for codes after the URL ?code=...
        const code = new URLSearchParams(window.location.search).get("code");

        const messages = {
        "201": "Cuenta creada exitosamente",
        "250": "Sesión cerrada exitosamente",
        "251": "No hay una sesión activa",
        "252": "Sesión no encontrada",
        "253": "Sesión expirada"
        };

        // Set the message
        if (code && messages[code]) {
            message.textContent = messages[code];
        }

        // Form that handles the login
        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {

                // Sends the login form
                const response = await fetch("/api/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                // Do the redirection if there is one / If it is successful goes to login.html
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                } else {
                    // If no redirection, who shouldn't arrive, print the response
                    const data = await response.json();

                    message.textContent =
                    data.detail || "Error en el inicio de sesión.";
                }
            
            } catch (error) {
                // Other kind of error is here
                console.error("Error de conexión:", error);

                message.textContent =
                    "No se pudo conectar con el servidor.";
            }

        });

    </script>

</body>

</html>
