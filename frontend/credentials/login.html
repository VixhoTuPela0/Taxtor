<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <h1>Iniciar sesión</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Usuario"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <p id="message"></p>


    <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");


    // =========================
    // MENSAJES DE REDIRECCIÓN
    // =========================

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    const messages = {
        "201": "Cuenta creada exitosamente",
        "250": "Sesión cerrada exitosamente",
        "251": "No hay una sesión activa",
        "252": "Sesión no encontrada",
        "253": "Sesión expirada"
    };

    if (code && messages[code]) {
        message.textContent = messages[code];
    }


    // =========================
    // LOGIN
    // =========================

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {

            const response = await fetch("/api/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            });


            if (response.redirected) {
                window.location.href = response.url;
                return;
            }


            if (response.ok) {

                message.textContent = "¡Sesión iniciada con éxito!";

                form.reset();

            } else {

                const data = await response.json();

                message.textContent =
                    data.detail || "Error en el inicio de sesión.";
            }

        } catch (error) {

            console.error("Error de conexión:", error);

            message.textContent =
                "No se pudo conectar con el servidor.";
        }

    });

    </script>

</body>

</html>
