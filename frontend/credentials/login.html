<!DOCTYPE html>

<head>
    <!-- Meta tags for character encoding and viewport settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to external CSS files for styling -->
    <link rel="stylesheet" href="/css/login.css">

    <title data-i18n="login_title">Login - Taxtor</title>

    <!-- Verify the language cookie -->
    <script>
        if (!document.cookie.includes("language=")) {
            document.cookie = "language=en; path=/; max-age=31536000; SameSite=Lax";
        }
    </script>

    <!-- Link to the JavaScript files -->
    <script src="/components/languages.js"></script>

</head>

<body>

    <main class="login-container">

        <!-- The language selector -->
        <div class="language-selector">
            <label for="language">🌐</label>           
            <select id="language">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
            </select>
        </div>

        <div class="login-box">

            <!-- The header of the login form -->
            <div class="login-header">
                <img src="/components/images/logo.png" alt="Logo" class="logo-image">
                <p data-i18n="login_header">Login to your account</p>
            </div>

            <!-- The message area for login feedback CORREGIR -->
            <div id="login-message" class="login-message"></div>

            <form id ="login-form" class="login-form">

                <!-- The username input field -->
                <div class="form-group">
                    <label for="username" data-i18n="login_username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        data-i18n="username_placeholder"
                        required
                    >
                </div>

                <!-- The password input field -->
                <div class="form-group">
                    <label for="password" data-i18n="login_password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        data-i18n="password_placeholder"
                        required
                    >
                </div>

                <!-- The submit button -->
                <button type="submit" class="login-button">
                    <span data-i18n="login_button">Login</span>
                </button>

            </form>

        </div>

    </main>

    <script>

        // Check if cookies are there and loads error codes
        document.addEventListener("DOMContentLoaded", async () => {
   
            // Look for codes after the URL ?code=... If there is, call showMessage
            const code = new URLSearchParams(window.location.search).get("code");
            if (code) {
                showMessage(parseInt(code));
            }
            
            initLanguage(); // Initialize the language settings


            try {
                const response = await fetch("/api/cookies_state");

                // Checks first if there is a redirection
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                // If it recieves code 200, the session/cookie is okay
                if (response.status == 200) {return;}
            } catch (error) {
                // If there is an error, it will be printed in the console
                console.error("Error checking the session:", error);
            }   
        });

        // Object that contains the message codes and their corresponding translation keys and types
        const messageCodes = {
            201: {
                key: "REGISTER_SUCCESSFUL",
                type: "success"
            },

            250: {
                key: "LOGOUT_SUCCESSFUL",
                type: "success"
            },

            251: {
                key: "NO_ACTIVE_SESSION",
                type: "error"
            },

            252: {
                key: "SESSION_NOT_FOUND",
                type: "error"
            },

            253: {
                key: "SESSION_EXPIRED",
                type: "error"
            },

            254: {
                key: "INVALID_CREDENTIALS",
                type: "error"
            },
        };

        // Function to show the message translated based on the code
        function showMessage(code) {
            // Get the message element
            const messageElement = document.getElementById("login-message");
            messageElement.textContent = "";

            // Get the translation key and type from the messageCodes object
            const message = messageCodes[code] 
            if (!message) {
                console.error("Unknown message code:", code);
                return;
            }

            // Set the message text and type
            messageElement.setAttribute("data-i18n", message.key);

            // Add the appropriate class for styling (success or error)
            messageElement.classList.remove("success", "error");
            messageElement.classList.add(message.type);
        }
    
        // Function to translate the page based on the selected language
        const languageSelector = document.getElementById("language");
        languageSelector.addEventListener("change", async () => {

            // Get the selected language from the dropdown
            const selectedLanguage = languageSelector.value;

            // Update the language and reload the page if successful
            document.cookie = `language=${selectedLanguage}; path=/`;
            location.reload();
        });
        
        // Get the form and message elements
        const form = document.getElementById("login-form");

        // Form that handles the login
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {

                // Sends the login form
                const response = await fetch("/api/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                });


                // Do the redirection if there is one / If it is successful goes to login.html
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                } else {
                    // If no redirection, so invalid credentials or other error, it will show the message
                    const data = await response.json();

                    showMessage(parseInt(data.detail));
                    initLanguage(); // Re-initialize the language settings to update the message translation
                }
            
            } catch (error) {
                // Other kind of error is here
                console.error("Error de conexión:", error);
            }

        });

    </script>

</body>

</html>
