<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
</head>

<body>

    <h1>Crear cuenta</h1>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Usuario"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p id="message"></p>


    <script>
        // Check if cookies are there
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch("/api/cookies_state");

                // Checks first if there is a redirection
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                // If it recieves code 200, the session/cookie is okay
                if (response.status == 200) {return;}
            } catch (error) {
                console.error("Error verificando la sesión:", error);
            }
        }); 

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        // The form for register an account
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            // Get elements from the body
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            
            try {
                // Calls register endpoint
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, email, password })
                });

                // If it's great, redirect to login
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }
                
                // In case of error
                if (!response.ok) {
                    const data = await response.json();
                    message.textContent = data.detail || "Error en el registro.";
                    return;
                }
            } catch (error) {
            // In case of another type of error
            console.error("Error de conexión:", error);
            message.textContent = "No se pudo conectar con el servidor.";
            }
        });

    </script>

</body>

</html>
