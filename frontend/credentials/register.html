<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
</head>

<body>

    <h1>Crear cuenta</h1>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Usuario"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p id="message"></p>


    <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (response.ok) {
            message.textContent = "¡Cuenta creada con éxito!";
            form.reset(); // Opcional: limpia los campos del formulario al terminar
        } else {
            // Si FastAPI devuelve un error estructurado, o un string directo
            message.textContent = data.detail || "Error en el registro.";
        }
    } catch (error) {
        // Esto se ejecuta si el backend está totalmente caído o no hay internet
        console.error("Error de conexión:", error);
        message.textContent = "No se pudo conectar con el servidor.";
    }
});

</script>

</body>

</html>
