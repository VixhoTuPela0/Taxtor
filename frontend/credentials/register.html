<!DOCTYPE html>

<head>
    <!-- Meta tags for character encoding and viewport settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to external CSS files for styling -->
    <link rel="stylesheet" href="/css/register.css">

    <title data-i18n="register_title">Register - Taxtor</title>

    <!-- Verify the language cookie -->
    <script>
        if (!document.cookie.includes("language=")) {
            document.cookie = "language=en; path=/; max-age=31536000; SameSite=Lax";
        }
    </script>

    <!-- Link to the JavaScript files -->
    <script src="/components/languages.js"></script>
</head>

<body>


    <div class="register-page">

        <div class="language-selector">
            <label for="language">🌐</label>

            <select id="language">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
            </select>
        </div>

        <div id="token-section">

            <div class="register-header">
                <img src="/components/images/logo.png" alt="Logo" class="logo-image">
                <h1 data-i18n="register_header">Register</h1>
            </div>

            <p data-i18n="register_token_description">Please enter your registration token below to create your account.</p>

            <form id="token-form">

                <input
                    type="text"
                    id="token"
                    placeholder="Enter your registration token"
                    data-i18n="token_placeholder"
                    required
                >
                <button type="submit" data-i18n="token_submit">Submit</button>

            </form>

            <p id="token-message" class="message"></p>

        </div>



        <div id="register-section" style="display: none;">

            <div class="register-header">
                <img src="/components/images/logo.png" alt="Logo" class="logo-image">
                <h1 data-i18n="create_account">Create Account</h1>
            </div>

            <form id="registerForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    data-i18n="username_placeholder"
                    required
                >
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    data-i18n="email_placeholder"
                    required
                >
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    data-i18n="password_placeholder"
                    required
                >
                <button type="submit" data-i18n="create_account">Create Account</button>

            </form>

            <p id="register-message" class="message"></p>

        </div>
    </div>

    <script>

        // Check if cookies are there
        document.addEventListener("DOMContentLoaded", async () => {

            // If there is a session cookie, redirect to the main page
            try {
                const response = await fetch("/api/cookies_state");

                // Checks if there is a redirection
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

            } catch (error) {
                console.error("Error verificando la sesión:", error);
            } 
            
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");

            // If a token is present in the URL, verify it
            if (token) {
                await verifyToken(token); // Verify the token if it exists in the URL
            } else {
                return; // If no token is provided, do nothing
            }

        }); 

        // Function to verify the token by sending it to the server
        async function verifyToken(token) {
            
            try {
                const response = await fetch("/api/invitations/validate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token })
                });

                if (!response.ok) {
                    const data = await response.json();

                    const type = "error";
                    const messageElement = "token-message"
                    console.error('Failed to verify token:', data.detail);
                    showMessage(messageElement, data.detail, type);
                    return false;
                } else {                  
                    showRegisterSection(); // Show the registration section if the token is valid
                    return true;
                }
                
            } catch (error) {
                console.error("Error verifying token:", error);
                return false;
            }
        }

        function showRegisterSection() {
            document.getElementById("token-section").style.display = "none"; // Hide the token section
            document.getElementById("register-section").style.display = "block"; // Show the registration section
        }

        // When the token form is submitted, redirect to the register page with the token as a query parameter
        const tokenForm = document.getElementById("token-form");
        tokenForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const token = document.getElementById("token").value;
            window.location.href = `register.html?token=${encodeURIComponent(token)}`;
        });

        const registerForm = document.getElementById("registerForm");
        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
                const token = new URLSearchParams(window.location.search).get("token");
                const username = document.getElementById("username").value;
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;

                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token, username, email, password })
                });

                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                if (!response.ok) {
                    const data = await response.json();
                    const type = "error";
                    const messageElement = "register-message"
                    console.error('Failed to register:', data.detail);
                    showMessage(messageElement, data.detail, type);
                    return;
                }

            } catch (error) {
                console.error("Error during registration:", error);
            }
        });

    </script>
</body>

</html>
