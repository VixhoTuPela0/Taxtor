<!DOCTYPE html>

<head>
    <!-- Meta tags for character encoding and viewport settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to external CSS files for styling -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/invitations.css">

    <title data-i18n="invitations_title">Invitations</title>

    <!-- Verify session-->
    <script src="/components/auth.js"></script>

    <!-- Link to external JavaScript files for functionality -->
    <script src="/components/languages.js"></script>
    <script src="/components/header.js"></script> <!-- Load the header component script -->

</head>

<body>

    <!-- Here the header will be loaded -->
    <div id="header"></div>

    <main class="invitations-page">
        
        <form id="invitation-form" class="invitation-form">
            
            <div>
                <h1 data-i18n="create_invitations_header">Invitations</h1>
            </div>

            <div class="form-group">

                <div id="invitation-message" class="invitation-message"></div> <!-- Message container for invitation-related messages -->

                <input
                type="email"
                id="email"
                placeholder="Enter email address"
                data-i18n="email_placeholder"
                />

                <select id="language" name="language" required>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>

                <button id="create-invitation" data-i18n="create_invitation_button">Create Invitation</button>
                
            </div>
    
        </form>
        
        
        <div class="invitations-list">
            
            
            <div>
                <h1 data-i18n="invitations_header">Invitations</h1>
            </div>

            <section class="invitations-card">
                <!-- Invitations will be dynamically loaded here -->
                 <div class="table-container" id="invitations-list"></div>
 
                </div>
            

        </div>

    </main>

    <script>

        // Load invitations when the page is loaded
        document.addEventListener('DOMContentLoaded', () => {
            loadInvitations(); // Load invitations when the page is loaded
        });

        // Handle form submission for creating invitations
        document.getElementById('invitation-form').addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent the default form submission behavior

            const email = document.getElementById('email').value;
            const language = document.getElementById('language').value;

            try {
                const reponse = await fetch('/api/invitations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        language
                    })
                });
            
                
                const data = await reponse.json();

                if (!reponse.ok) {
                    const type = "error"
                    const messageElement = "invitation-message"
                    showMessage(messageElement, data.detail, type);
                    initLanguage(); // Re-initialize the language after showing the message
                }
                else {
                    const type = "success"
                    const messageElement = "invitation-message"
                    showMessage(messageElement, data.message, type);
                    initLanguage(); // Re-initialize the language after showing the message
                    await loadInvitations(); // Reload the invitations after successful creation
                }
            
            
            }
            catch (error) {
                console.error('Error sending invitation:', error);
                document.getElementById('invitation-message').textContent = 'Failed to send invitation';
            }
        });



        async function deleteInvitation(invitationId) {
            try {
                const response = await fetch("/api/invitations/delete", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ id: invitationId })
                });

                const data = await response.json();

                if (!response.ok) {
                    console.error('Failed to delete invitation:', data.detail);
                } else {
                    const type = "success"
                    const messageElement = "invitation-message"
                    console.log(data.message);
                    showMessage(messageElement, data.message, type);
                    initLanguage(); // Re-initialize the language after showing the message
                    await loadInvitations(); // Reload the invitations after deletion
                }
                
            } 
            catch (error) {
                console.error('Error deleting invitation:', error);
            }
        }
    

        // Function to get the language name based on the user's selected language
        const languageNames = {
            en: {
                en: "English",
                fr: "French",
                es: "Spanish"
            },
            es: {
                en: "Inglés",
                fr: "Francés",
                es: "Español"
            },
            fr: {
                en: "Anglais",
                fr: "Français",
                es: "Espagnol"
            }
        };
       
        // Function to get the language name based on the user's selected language
        function getLanguageName(languageCode, userLanguage) {
            return languageNames[userLanguage][languageCode] || languageCode;
        }

        async function loadInvitations() {

            // Get the user's selected language
            const userLanguage = await getLanguage();
            
            // Get the container where invitations will be displayed
            const container = document.getElementById("invitations-list");

            container.innerHTML = ""; // Clear the container before loading new invitations

            try {
                // Fetch the list of invitations from the server
                const response = await fetch("/api/invitations_list", {
                    method: "GET",
                    credentials: "include" // Include credentials for authentication
                });

                // Check if the response is successful
                if (!response.ok) {
                    console.error("Failed to load invitations:", response.statusText);
                    return;
                }

                // Parse the response as JSON
                const data = await response.json();
                const invitations = data.invitations;

                // Check if there are no invitations and display a message if so
                if (!invitations || invitations.length === 0) {
                    container.innerHTML = `<div class="empty-invitations" data-i18n="no_invitations">No invitations found.</div>`;
                    initLanguage(); // Re-initialize the language after showing the message
                    return;
                }

                const header = document.createElement("div");
                header.className = "invitation-row invitation-header";
                header.innerHTML = `
                    <div class="invitation-cell" data-i18n="email">HOLA</div>
                    <div class="invitation-cell" data-i18n="language">Language</div>
                    <div class="invitation-cell" data-i18n="creation_date">Creation Date</div>
                    <div class="invitation-cell" data-i18n="expiration_date">Expiration Date</div>
                    <div></div>
                `;
                initLanguage(); // Re-initialize the language after creating the header
                container.appendChild(header);

                invitations.forEach(invitation => {
                    const row = document.createElement("div");
                    row.className = "invitation-row";
                    row.innerHTML = `
                        <div class="invitation-cell">${invitation.email}</div>
                        <div class="invitation-cell">${getLanguageName(invitation.language, userLanguage)}</div>
                        <div class="invitation-cell">${new Date(invitation.created_at).toLocaleString()}</div>
                        <div class="invitation-cell">${new Date(invitation.expires_at).toLocaleString()}</div>
                        <button class="delete-button" data-id="${invitation.id}">🗑️</button>
                    `;
                    container.appendChild(row);
                });

                document.querySelectorAll(".delete-button").forEach(button => {
                    button.addEventListener("click", async (event) => {
                        const invitationId = event.target.getAttribute("data-id");
                        await deleteInvitation(invitationId);
                    });
                });
            } catch (error) {
                console.error("Error loading invitations:", error);
            }

        }
            

    </script>

</body>
